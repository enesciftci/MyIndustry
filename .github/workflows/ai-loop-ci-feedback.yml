name: AI Loop CI Feedback

on:
  workflow_run:
    workflows: ["Run Tests"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ai-loop-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  resume-on-failure:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'ai/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Comment CI failure on related PR
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.workflow_run.head_branch;
            const runUrl = context.payload.workflow_run.html_url;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
            });
            if (!prs.data.length) {
              core.info(`No open PR for branch ${branch}`);
              return;
            }
            const pr = prs.data[0];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                '## AI Loop — CI failed',
                '',
                `Branch \`${branch}\` failed workflow **Run Tests**.`,
                '',
                `Logs: ${runUrl}`,
                '',
                'Human or a resumed Cursor agent should inspect failures.',
                'No auto-merge will occur.',
              ].join('\n'),
            });

      - name: Best-effort agent resume hint
        if: ${{ env.CURSOR_API_KEY != '' }}
        run: |
          echo "CURSOR_API_KEY present."
          echo "Full Agent.resume with CI log injection requires agent_id stored on the issue;"
          echo "orchestrator comments include Agent ID for manual/follow-up resume."
          echo "Skipping automatic resume here to avoid duplicate cloud burns without stored agent_id binding."
