name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        cache: true
        cache-dependency-path: '**/*.csproj'

    - name: Make scripts executable
      run: chmod +x scripts/build scripts/test scripts/validate scripts/verify scripts/ci scripts/ai-loop-init scripts/ai-loop-record

    - name: Run CI verification
      run: ./scripts/ci

    - name: Upload coverage / test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: |
          TestResults/
          **/TestResults/
          **/coverage.cobertura.xml
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload verify logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: backend-verify-logs
        path: .ai-loop/logs/
        if-no-files-found: ignore
        retention-days: 14
